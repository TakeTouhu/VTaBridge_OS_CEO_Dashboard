<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTaBridge OS - CEO Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' font-family='sans-serif' fill='%23fff' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-name">VTaBridge OS<span>CEO Dashboard</span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/home" data-route="home"><span class="nav-icon">🏠</span>ホーム</a>
      <a href="#/projects" data-route="projects"><span class="nav-icon">📁</span>案件一覧</a>
      <a href="#/deals" data-route="deals"><span class="nav-icon">🤝</span>商談</a>
      <a href="#/analytics" data-route="analytics"><span class="nav-icon">📊</span>売上分析</a>
      <a href="#/minutes" data-route="minutes"><span class="nav-icon">📝</span>AI議事録取込</a>
      <a href="#/documents" data-route="documents"><span class="nav-icon">📄</span>書類作成</a>
      <a href="#/assistant" data-route="assistant"><span class="nav-icon">💬</span>AI秘書</a>
      <a href="#/settings" data-route="settings"><span class="nav-icon">⚙️</span>設定</a>
    </nav>
    <div class="sidebar-foot">
      <div id="user-info" class="muted"></div>
      <button class="btn btn-sm" id="logout-btn" style="margin-top:8px;">ログアウト</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="login-screen" id="login-screen" hidden>
  <form class="card login-card" id="login-form">
    <div class="brand" style="padding:0 0 18px;">
      <div class="brand-mark">V</div>
      <div class="brand-name">VTaBridge OS<span>CEO Dashboard</span></div>
    </div>
    <label class="form-label">メールアドレス
      <input class="input" type="email" id="login-email" autocomplete="username" required>
    </label>
    <label class="form-label">パスワード
      <input class="input" type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <div id="login-error" class="form-error" hidden></div>
    <button class="btn btn-primary" type="submit" style="width:100%; margin-top:8px;">ログイン</button>
    <div class="muted" style="margin-top:12px;">初期アカウントはサーバー起動時のコンソールに表示されます。</div>
  </form>
</div>

<div class="chart-tooltip" id="chart-tooltip" hidden></div>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
